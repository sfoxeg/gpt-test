services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catchme
      POSTGRES_USER: catchme
      POSTGRES_PASSWORD: catchme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchme -d catchme"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://catchme:catchme@db:5432/catchme
      TEST_DATABASE_URL: postgresql+asyncpg://catchme:catchme@db:5432/catchme
      SECRET_KEY: change-me-before-deploy
      # Add the deployed frontend origin(s), comma-free JSON array.
      APP__CORS_ALLOW: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost","https://localhost","capacitor://localhost"]'
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  backend-tests:
    build: ./backend
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+asyncpg://catchme:catchme@db:5432/catchme
      TEST_DATABASE_URL: postgresql+asyncpg://catchme:catchme@db:5432/catchme
      SECRET_KEY: test-only-secret
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && alembic check && pytest -q"
volumes:
  postgres_data:
  frontend_node_modules:
