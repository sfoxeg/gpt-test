services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catchme
      POSTGRES_USER: catchme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchme -d catchme"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://catchme:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/catchme
      TEST_DATABASE_URL: postgresql+asyncpg://catchme:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/catchme
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      APP__CORS_ALLOW: '${APP_CORS_ALLOW:-["http://localhost:5173","http://127.0.0.1:5173","http://localhost","https://localhost","capacitor://localhost"]}'
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on:
      - backend
  backend-tests:
    build: ./backend
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+asyncpg://catchme:${POSTGRES_PASSWORD:-catchme}@db:5432/catchme
      TEST_DATABASE_URL: postgresql+asyncpg://catchme:${POSTGRES_PASSWORD:-catchme}@db:5432/catchme
      SECRET_KEY: test-only-secret
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && alembic check && pytest -q"
volumes:
  postgres_data:
  frontend_node_modules:
