services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catchme
      POSTGRES_USER: catchme
      POSTGRES_PASSWORD: catchme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchme -d catchme"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://catchme:catchme@db:5432/catchme
      SECRET_KEY: change-me-before-deploy
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [backend]
volumes:
  postgres_data:
  frontend_node_modules:
